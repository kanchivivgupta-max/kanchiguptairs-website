<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Definitions for gradients, glowing effects, and grid patterns -->
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(113, 112, 255, 0.04)" stroke-width="0.5"/>
    </pattern>
    <pattern id="dot-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(113, 112, 255, 0.12)"/>
    </pattern>

    <!-- Glowing effect for nodes and lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7170ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b0aeff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141518" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0c0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="edge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7170ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#b0aeff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#27a644" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="800" height="450" fill="#08090a"/>
  <!-- Grids -->
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#dot-grid)"/>

  <!-- Ambient background glow orbs -->
  <circle cx="200" cy="100" r="150" fill="#7170ff" fill-opacity="0.03" filter="blur(40px)"/>
  <circle cx="600" cy="300" r="180" fill="#27a644" fill-opacity="0.02" filter="blur(50px)"/>

  <!-- TITLE HEADER -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#7170ff" letter-spacing="1.5" text-transform="uppercase">AI-Driven Legal Compliance Architecture</text>
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#8a8f98" letter-spacing="0.5">Deterministic Stateful Multi-Agent Compliance System (FSM-Based)</text>
    <line x1="0" y1="30" x2="720" y2="30" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  </g>

  <!-- ==================== FLOW EDGES (CONNECTIVE PIPELINES) ==================== -->
  <!-- Main flow path -->
  <path d="M 180 220 Q 280 160 380 220 T 580 220" fill="none" stroke="url(#edge-grad)" stroke-width="2.5" filter="url(#subtle-glow)"/>
  <path d="M 380 220 L 380 340" fill="none" stroke="#7170ff" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.6"/>
  <path d="M 380 340 L 580 220" fill="none" stroke="#27a644" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.5"/>

  <!-- Flow Direction Arrows -->
  <polygon points="260,192 268,187 260,183" fill="#b0aeff"/>
  <polygon points="490,215 498,220 490,225" fill="#27a644"/>

  <!-- ==================== NODE 1: INPUT GATES ==================== -->
  <g transform="translate(40, 150)">
    <!-- Node container card -->
    <rect width="140" height="140" rx="8" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    <rect width="140" height="140" rx="8" fill="none" stroke="#7170ff" stroke-width="1" stroke-opacity="0.2"/>
    
    <!-- Header strip -->
    <path d="M 0 8 Q 0 0 8 0 L 132 0 Q 140 0 140 8 L 140 28 L 0 28 Z" fill="rgba(113, 112, 255, 0.06)"/>
    <text x="12" y="18" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#7170ff" letter-spacing="1" text-transform="uppercase">01 / Ingest Gates</text>
    <line x1="0" y1="28" x2="140" y2="28" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Content metrics -->
    <text x="12" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f7f8f8">Fact Ingestion</text>
    <text x="12" y="65" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#8a8f98">Statutory Parsing</text>

    <!-- Sub-agents list -->
    <rect x="10" y="80" width="120" height="20" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    <circle cx="20" cy="90" r="3" fill="#7170ff" filter="url(#glow)"/>
    <text x="30" y="93" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f7f8f8">DocParser.agent</text>

    <rect x="10" y="106" width="120" height="20" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    <circle cx="20" cy="116" r="3" fill="#7170ff" filter="url(#glow)"/>
    <text x="30" y="119" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f7f8f8">FactExtractor.py</text>
  </g>

  <!-- ==================== NODE 2: STATE MACHINE CORE ==================== -->
  <g transform="translate(310, 150)">
    <!-- Node container card -->
    <rect width="180" height="140" rx="8" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    <rect width="180" height="140" rx="8" fill="none" stroke="#7170ff" stroke-width="1.5" stroke-opacity="0.4" filter="url(#subtle-glow)"/>
    
    <!-- Header strip -->
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 28 L 0 28 Z" fill="rgba(113, 112, 255, 0.1)"/>
    <text x="12" y="18" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#b0aeff" letter-spacing="1" text-transform="uppercase">02 / Compliance FSM</text>
    <line x1="0" y1="28" x2="180" y2="28" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- State indicators -->
    <text x="12" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f7f8f8">FSM Transition Core</text>
    
    <!-- Active State diagram -->
    <g transform="translate(15, 62)">
      <!-- Circle 1 -->
      <circle cx="25" cy="25" r="18" fill="rgba(113, 112, 255, 0.05)" stroke="#7170ff" stroke-width="1"/>
      <text x="25" y="28" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#b0aeff" text-anchor="middle">PARSED</text>

      <!-- Arrow -->
      <line x1="43" y1="25" x2="107" y2="25" stroke="#7170ff" stroke-width="1" stroke-dasharray="2,2"/>
      <polygon points="78,22 83,25 78,28" fill="#7170ff"/>

      <!-- Circle 2 -->
      <circle cx="125" cy="25" r="18" fill="rgba(39, 166, 68, 0.05)" stroke="#27a644" stroke-width="1.5" filter="url(#subtle-glow)"/>
      <text x="125" y="28" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#27a644" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Transition lock status -->
    <rect x="12" y="112" width="156" height="18" rx="3" fill="rgba(39, 166, 68, 0.06)" stroke="rgba(39, 166, 68, 0.2)" stroke-width="1"/>
    <text x="22" y="124" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="500" fill="#27a644">TRANSITION_VALID: 100% SECURE</text>
  </g>

  <!-- ==================== NODE 3: HUMAN-IN-THE-LOOP ==================== -->
  <g transform="translate(310, 320)">
    <!-- Small sub-panel representing the human console -->
    <rect width="180" height="85" rx="6" fill="#0d0e10" stroke="rgba(113, 112, 255, 0.15)" stroke-width="1"/>
    <text x="12" y="18" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#8a8f98" letter-spacing="1" text-transform="uppercase">Human-in-the-Loop Gateway</text>
    <text x="12" y="36" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f7f8f8">Adjudication Console</text>
    
    <rect x="12" y="48" width="156" height="24" rx="4" fill="rgba(113, 112, 255, 0.08)" stroke="#7170ff" stroke-width="1"/>
    <polygon points="25,56 21,60 29,60" fill="#7170ff"/>
    <text x="38" y="63" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#b0aeff">Officer_Review.input()</text>
  </g>

  <!-- ==================== NODE 4: OUTBOUND AUDITING ==================== -->
  <g transform="translate(620, 150)">
    <!-- Node container card -->
    <rect width="140" height="140" rx="8" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    <rect width="140" height="140" rx="8" fill="none" stroke="#27a644" stroke-width="1" stroke-opacity="0.2"/>
    
    <!-- Header strip -->
    <path d="M 0 8 Q 0 0 8 0 L 132 0 Q 140 0 140 8 L 140 28 L 0 28 Z" fill="rgba(39, 166, 68, 0.06)"/>
    <text x="12" y="18" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#27a644" letter-spacing="1" text-transform="uppercase">03 / Audited Log</text>
    <line x1="0" y1="28" x2="140" y2="28" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Content metrics -->
    <text x="12" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f7f8f8">Immutable Ledgers</text>
    <text x="12" y="65" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#8a8f98">Explainable Outputs</text>

    <!-- Sub-agents list -->
    <rect x="10" y="80" width="120" height="20" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    <circle cx="20" cy="90" r="3" fill="#27a644" filter="url(#glow)"/>
    <text x="30" y="93" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f7f8f8">AuditLogger.agent</text>

    <rect x="10" y="106" width="120" height="20" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    <circle cx="20" cy="116" r="3" fill="#27a644" filter="url(#glow)"/>
    <text x="30" y="119" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f7f8f8">CryptographicSign</text>
  </g>

  <!-- FOOTER BRANDING -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8" fill="#62666d">MODEL DESIGN SYSTEM: LINEAR-FSM-01</text>
    <text x="720" y="0" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7170ff" text-anchor="end">kanchiguptairs.com</text>
  </g>
</svg>
